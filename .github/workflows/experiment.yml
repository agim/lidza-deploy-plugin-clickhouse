name: Experiment
on:
  push:
    branches: ['experiment/**']
permissions:
  contents: read
jobs:
  json-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Load a wide JSON table under a memory cap, three ways
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/plugin" .
          df -h /mnt | tail -1
          sudo CI=true experiments/json-load.sh "$RUNNER_TEMP/plugin" 12 "7168 4608"
