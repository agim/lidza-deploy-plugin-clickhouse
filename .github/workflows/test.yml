name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: |
          go vet ./...
          go test ./...
      - name: A real server, end to end
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/plugin" .
          sudo CI=true scripts/integration.sh "$RUNNER_TEMP/plugin"
